plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'

    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.typeup'
    compileSdk 36

    defaultConfig {
        applicationId "com.typeup"
        minSdk 23
        targetSdk 36
        versionCode 9
        versionName "2.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testBuildType "debug"

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            minifyEnabled false

            manifestPlaceholders = [appName: "TypeUp Dev"]
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            manifestPlaceholders = [appName: "TypeUp"]
        }

        staging {
            initWith release

            applicationIdSuffix ".stg"
            versionNameSuffix "-stg"
            signingConfig signingConfigs.debug

            manifestPlaceholders = [appName: "TypeUp Stg"]
        }

        stagingTest {
            initWith staging

            applicationIdSuffix ".stg.test"
            versionNameSuffix "-stg-test"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-staging-test-rules.pro'

            manifestPlaceholders = [appName: "TypeUp StgTest"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

}

dependencies {
    def coroutines_version = "1.11.0"

    // App dependencies
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation "androidx.startup:startup-runtime:1.2.0"

    //Hilt
    implementation "com.google.dagger:hilt-android:2.60.1"
    kapt "com.google.dagger:hilt-android-compiler:2.60.1"

    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
}

kapt {
    correctErrorTypes true
}